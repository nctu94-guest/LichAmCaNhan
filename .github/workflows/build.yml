name: Build unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build real iOS app and package unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: List generated schemes
        run: xcodebuild -list -project LichAmCaNhan.xcodeproj

      - name: Archive iOS application (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LichAmCaNhan.xcodeproj \
            -scheme LichAmCaNhan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/LichAmCaNhan.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/LichAmCaNhan.xcarchive/Products/Applications/LichAmCaNhan.app"
          test -d "$APP_PATH"
          mkdir -p "$PWD/build/ipa/Payload"
          ditto "$APP_PATH" "$PWD/build/ipa/Payload/LichAmCaNhan.app"
          cd "$PWD/build/ipa"
          /usr/bin/zip -qry LichAmCaNhan-unsigned.ipa Payload
          test -s LichAmCaNhan-unsigned.ipa
          unzip -l LichAmCaNhan-unsigned.ipa | head -40

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichAmCaNhan-unsigned-ipa
          path: build/ipa/LichAmCaNhan-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode archive for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LichAmCaNhan-build-diagnostics
          path: |
            build/**/*.xcresult
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
