name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build App (Unsigned)
        run: |
          mkdir -p Payload
          xcodebuild -project LichAmCaNhan.xcodeproj -scheme LichAmCaNhan -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          cp -r build/Release-iphoneos/LichAmCaNhan.app Payload/
          zip -r LichAmCaNhan.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-app-ipa
          path: LichAmCaNhan.ipa
