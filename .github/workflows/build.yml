name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile App
        run: |
          mkdir -p Payload/LichAmCaNhan.app
          swiftc ContentView.swift -o Payload/LichAmCaNhan.app/LichAmCaNhan -sdk $(xcrun --show-sdk-path --sdk iphoneos) -target arm64-apple-ios15.0 -framework SwiftUI -framework UIKit -framework Foundation -framework UserNotifications
          
          # Tạo file Info.plist tối thiểu cho app iOS
          cat << 'EOF' > Payload/LichAmCaNhan.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.example.LichAmCaNhan</string>
              <key>CFBundleName</key>
              <string>LichAmCaNhan</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
          </dict>
          </dict>
          EOF

          zip -r LichAmCaNhan.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-app-ipa
          path: LichAmCaNhan.ipa
